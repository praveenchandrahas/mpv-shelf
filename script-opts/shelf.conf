# mpv-shelf options. Every line is optional; the values below are the defaults.
# Where the indexer keeps catalog.json, posters/ and history.json
#data_dir=~/.local/share/mpv-shelf
# The indexer command (on PATH, or a full path). If it is not executable, set python=python3 as well.
#indexer=shelf-index
#python=
#ffmpeg=ffmpeg
# Most posters per row (fewer are used when the window is narrow)
#cols=6
# Most poster bitmaps on screen at once
#max_posters=12
# The catalog is rebuilt in the background when it is older than this
#refresh_hours=6
# A film stopped before this many seconds is not offered under Continue Watching
#resume_min_s=60
# Played at least this far counts as watched
#watched_pct=92
# Pause the film that is playing while the browser is open
#pause_on_open=no
# Black background while open (the video track is switched off and back on)
#hide_video_when_open=no
# Accent colour, RRGGBB
#accent=FFB054
